name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit || true

      - name: Run tests
        run: npm test

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            THEO_EMAIL
            THEO_PHONE
            THEO_EMAIL_NEMETSCHEK
            THEO_PHONE_NEMETSCHEK
            THEO_EMAIL_DIRECT
            THEO_PHONE_DIRECT
            RESEND_API_KEY
            IP_HASH_SECRET
        env:
          THEO_EMAIL: ${{ secrets.THEO_EMAIL }}
          THEO_PHONE: ${{ secrets.THEO_PHONE }}
          THEO_EMAIL_NEMETSCHEK: ${{ secrets.THEO_EMAIL_NEMETSCHEK }}
          THEO_PHONE_NEMETSCHEK: ${{ secrets.THEO_PHONE_NEMETSCHEK }}
          THEO_EMAIL_DIRECT: ${{ secrets.THEO_EMAIL_DIRECT }}
          THEO_PHONE_DIRECT: ${{ secrets.THEO_PHONE_DIRECT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          IP_HASH_SECRET: ${{ secrets.IP_HASH_SECRET }}

      - name: Deployment summary
        run: |
          echo "✅ Deploy erfolgreich!"
          echo "🌍 URL: https://foundtheo.descipar.workers.dev"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Ausgelöst von: ${{ github.actor }}"
