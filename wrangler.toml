name = "foundtheo"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "theo-badge"
database_id = "15905aeb-256d-4312-8d3a-13a23b4bddaf"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "theo-badges-images"
jurisdiction = "eu"

[vars]
THEO_BIRTH_DATE = "2025-04-17"
THEO_NAME = "Theo"
THEO_BREED = "Labrador"
THEO_TITLE = "Chief Snack Officer"
THEO_BADGE_NR = "170425"

# Secrets (nicht hier eintragen – als Worker Secret setzen!):
# wrangler secret put THEO_EMAIL              ← Standard-Kontakt (Fallback)
# wrangler secret put THEO_PHONE              ← Standard-Kontakt (Fallback)
# wrangler secret put THEO_EMAIL_NEMETSCHEK   ← Kontakt für /theo/nemetschek (optional)
# wrangler secret put THEO_PHONE_NEMETSCHEK   ← Kontakt für /theo/nemetschek (optional)
# wrangler secret put THEO_EMAIL_DIRECT       ← Kontakt für direkte Seite /theo (optional)
# wrangler secret put THEO_PHONE_DIRECT       ← Kontakt für direkte Seite /theo (optional)
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put RESEND_API_KEY   ← Resend API-Key für Scan-Benachrichtigungen
#   Voraussetzung: foundtheo.de als Absender-Domain in Resend verifizieren (DNS-Eintrag)
